# tests.yml: validator, module unit tests and a c3 compile of the all-modules harness (a template
# clone with --modules all, modules source = this commit), the format check (blocking) and
# brand-lint, from the tools release 3.0.0, for every push and PR.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  modules:
    uses: xewe-labs/xewe-os-tools/.github/workflows/xewe-modules-tests.yml@3.0.0
    with:
      tools_ref: "3.0.0"
      strict_lint: true
