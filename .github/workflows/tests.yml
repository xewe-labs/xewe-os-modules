# tests.yml: validator, module unit tests and a c3 compile of the all-modules harness (a template
# clone with --modules all, modules source = this commit), the format check (blocking),
# brand-lint and, on a tag, the release card check (the card from the tag message against
# the unit tests JUnit and the c3 image, job "modules / release card check", which
# scripts/release.sh waits for), from the tools release 3.1.6, for every push, PR and tag.
name: tests
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  modules:
    uses: xewe-labs/xewe-os-tools/.github/workflows/xewe-modules-tests.yml@3.1.6
    with:
      tools_ref: "3.1.6"
      strict_lint: true
