# tests.yml: validator, module unit tests and a c3 compile of the all-modules harness (a template
# clone with --modules all, modules source = this commit), the format check (blocking),
# brand-lint and, on a prepare commit, the release card check (every release_card.md of this
# tree against the unit tests' JUnit and the c3 image: `xewe release-card verify --ci
# --unit-only`; job "modules / release card check", which scripts/release.sh waits for), from the
# tools release 3.1.5, for every push and PR.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  modules:
    uses: xewe-labs/xewe-os-tools/.github/workflows/xewe-modules-tests.yml@3.1.5
    with:
      tools_ref: "3.1.5"
      strict_lint: true
