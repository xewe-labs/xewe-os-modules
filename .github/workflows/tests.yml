# The tools' modules workflow: validator, unit tests, a c3 build of the all-modules harness, format
# check, brand-lint and, on a tag, the job "modules / release card check" that scripts/release.sh waits for.
name: tests
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  modules:
    uses: xewe-labs/xewe-os-tools/.github/workflows/xewe-modules-tests.yml@3.1.6
    with:
      tools_ref: "3.1.6"
      strict_lint: true
